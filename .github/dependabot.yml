version: 2
# No entry sets `target-branch`: pull requests go to the default branch
# (`main`) anyway, and while `target-branch` is set, GitHub doesn't apply
# the entry's options (`labels`, `ignore`, ...) to security updates
updates:
  # Dependencies in `pyproject.toml` (the `docs` and `tests` extras)
  - package-ecosystem: pip
    directory: /
    labels: ["type: dependencies"]
    schedule:
      interval: monthly
    versioning-strategy: increase-if-necessary
    groups:
      # Dependencies of the documentation, in pull requests of their own
      docs-dependencies:
        patterns: ["mkdocs", "mkdocs-*", "pymdown-extensions"]
      # Dependencies match the first group listed
      python-dependencies:
        patterns: ["*"]
  # Actions in the workflows, including the pins of the shared actions of
  # `elixir-cloud-aai/.github` (to the commits of its releases,
  # `@<commit> # vX.Y.Z`)
  - package-ecosystem: github-actions
    directory: /
    labels: ["type: dependencies"]
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
