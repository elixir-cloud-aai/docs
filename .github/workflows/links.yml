# Weekly checks of what the docs point to outside this repository: external
# links (`links`) and GA4GH service URLs (`services`). Not part of `ci.yml`
# and not required checks, because external sites go down at random and
# would block merges; each check opens (or comments on) one issue instead.
# Links between pages are checked by `mkdocs build --strict` in `ci.yml`
name: Links

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links
  cancel-in-progress: false

jobs:

  links:
    name: Link check
    # Forks would open issues in their own copy every week
    if: github.repository_owner == 'elixir-cloud-aai'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Configuration in `lychee.toml`. The token raises GitHub's rate limit
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config lychee.toml --no-progress
            "docs/**/*.md" "includes/*.md" README.md
          output: lychee/out.md
          fail: false
          token: ${{ github.token }}
      # lychee exits with 2 for dead links; other codes (e.g. a config
      # error) fail the run without an issue
      - name: Fail on lychee errors
        if: >-
          steps.lychee.outputs.exit_code != '0' &&
          steps.lychee.outputs.exit_code != '2'
        run: exit 1
      - name: Report dead links
        if: steps.lychee.outputs.exit_code == '2'
        uses: ./.github/actions/report-issue
        with:
          title: Dead links in the docs
          intro: The weekly link check found dead links
          report: lychee/out.md
      # Show the run as failed, too
      - name: Fail on dead links
        if: steps.lychee.outputs.exit_code == '2'
        run: exit 1

  # GA4GH service URLs in the docs that are not in the Cloud Registry or
  # don't answer `service-info` (`scripts/check_services.py`, configured in
  # `service-check.toml`)
  services:
    name: Service check
    if: github.repository_owner == 'elixir-cloud-aai'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Standard library only, no dependencies
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # Exit code 2 for problems, 1 if the check could not run (e.g. the
      # registry is down), which fails the run without an issue
      - name: Check services
        id: check
        run: |
          status=0
          python scripts/check_services.py --output service-check/out.md || status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" != 0 ] && [ "$status" != 2 ]; then
            exit "$status"
          fi
      - name: Report problems
        if: steps.check.outputs.exit_code == '2'
        uses: ./.github/actions/report-issue
        with:
          title: Service URLs in the docs
          intro: >-
            The weekly service check found service URLs that are not in
            the Cloud Registry or don't answer `service-info`
          report: service-check/out.md
      - name: Fail on problems
        if: steps.check.outputs.exit_code == '2'
        run: exit 1
