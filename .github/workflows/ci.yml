# Everything that must pass on pull requests and pushes to `main`: the strict
# build of the documentation. The gate `passed` ("CI passed") is the only
# required check. No `paths:` filters, so that the gate always reports. The
# deployment to GitHub Pages is in `deploy.yml` (until the switch to Read the
# Docs)

name: CI
on:
  push:
    branches: [main]
  # `edited` reruns the title check when the title changes
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # Pull request titles become the commit messages on `main` (squash merges):
  # Conventional Commits, at most 50 characters (shared action of
  # elixir-cloud-aai/.github, pinned to the commit of a release). Skipped on
  # pushes and for Dependabot, whose titles can't be configured to pass,
  # unless someone else edits the title
  title:
    name: PR title
    if: >-
      github.event_name == 'pull_request' && (
        github.event.pull_request.user.login != 'dependabot[bot]' ||
        github.event.changes.title &&
        github.event.sender.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check PR title
        uses: elixir-cloud-aai/.github/actions/pr-title@743e82d290a53768454999e413756a924e383259 # v1.0.0

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Python version of Read the Docs (`.readthedocs.yaml`)
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[docs]"
      # Wrong spellings of "ELIXIR On-Cloud", "ELIXIR" and "ELIXIR Europe"
      - name: Check names
        run: python scripts/check_names.py
      # Fails on warnings, e.g., of broken links, anchors and references
      - name: Build documentation
        run: mkdocs build --strict

  # Fails if any other job failed or was cancelled, or was skipped where that
  # is not intended: `title` on pushes (and for Dependabot). Add every new
  # job to `needs`
  passed:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [title, docs]
    permissions: {}
    steps:
      - name: Check results of all jobs
        uses: elixir-cloud-aai/.github/actions/gate@743e82d290a53768454999e413756a924e383259 # v1.0.0
        with:
          needs: ${{ toJSON(needs) }}
          # `title` is skipped on purpose on pushes and for Dependabot
          allow-skipped: title
