copyright: >
  Copyright &copy; ELIXIR On-Cloud –
  <a href="#__consent">Change cookie settings</a>
edit_uri: edit/main/docs/

extra:
  analytics:
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve this page by
            using our <a href="..." target="_blank" rel="noopener">feedback
            form</a>.
    provider: google
    property: G-65GGNT08KH
  consent:
    cookies:
      analytics:
        name: Google Analytics
        checked: false
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.
    title: Cookie consent
  social:
    # Rendered as an image by `overrides/partials/social.html`
    - image: images/logo_elixir_on_cloud_mark_night.svg
      link: https://elixir-on.cloud/
      name: ELIXIR On-Cloud website
    - icon: custom/elixir
      link: https://elixir-europe.org/
      name: ELIXIR website
    - icon: custom/ga4gh
      link: https://ga4gh.org/
      name: GA4GH website
    - icon: custom/github
      link: https://github.com/elixir-cloud-aai
      name: ELIXIR On-Cloud GitHub organization
    - icon: custom/slack
      link: https://join.slack.com/t/elixir-cloud/shared_invite/zt-4f6zdhi84-X4YBkJHxhYmVIHJkRfY2JQ
      name: ELIXIR On-Cloud Slack board
    - icon: custom/forum
      link: https://github.com/orgs/elixir-cloud-aai/discussions
      name: ELIXIR On-Cloud Q&A forum
    - icon: custom/email
      link: mailto:cloud-service@elixir-europe.org
      name: ELIXIR On-Cloud service email
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
        - includes/references.md
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true
