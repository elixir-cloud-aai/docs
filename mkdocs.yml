extra_css:
  - stylesheets/extra.css
plugins:
  - search
repo_name: elixir-cloud-aai/docs
repo_url: https://github.com/elixir-cloud-aai/docs
site_name: ELIXIR On-Cloud docs
site_description: >-
  Documentation of the ELIXIR On-Cloud federated deployment
# Read the Docs sets `READTHEDOCS_CANONICAL_URL` (the site's own URL)
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://docs.elixir-on.cloud/"]
theme:
  custom_dir: overrides
  # The favicon follows the colour scheme of the browser (see the file). The
  # header and the footer are dark in both schemes of the site, hence the white
  # (night) version of the mark in both; the page body uses day and night
  # versions of the lockup (`docs/stylesheets/extra.css`)
  favicon: images/favicon.svg
  logo: images/logo_elixir_on_cloud_mark_night.svg
  features:
    - announce.dismiss
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github
  language: en
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
