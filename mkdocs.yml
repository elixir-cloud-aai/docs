extra_css:
  - stylesheets/extra.css
# `registry.py` replaces `<!-- registry:services ... -->` markers with tables
# of the services in the Cloud Registry; `last_verified.py` fails the build
# on malformed `last_verified` dates of fact pages (see `README.md`)
hooks:
  - hooks/registry.py
  - hooks/last_verified.py
plugins:
  - search
repo_name: elixir-cloud-aai/docs
repo_url: https://github.com/elixir-cloud-aai/docs
site_name: ELIXIR On-Cloud docs
site_description: >-
  Documentation of the ELIXIR On-Cloud federated deployment
# Read the Docs sets `READTHEDOCS_CANONICAL_URL` (the site's own URL)
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://docs.elixir-on.cloud/"]
theme:
  custom_dir: overrides
  # The design follows the main page (`elixir-on.cloud`, repository
  # `elixir-cloud-aai/landing-page`): its colours, its text font and its
  # logos. The favicon follows the colour scheme of the browser (see the
  # file). The header shows the day and night versions of the logo by the
  # colour scheme of the site (`overrides/partials/logo.html`, instead of
  # `logo`). Colours are set in `docs/stylesheets/extra.css`
  favicon: images/favicon.svg
  font:
    # The main page's text font; its code font is a stack of system fonts,
    # not a web font, so the code font stays Material's default
    text: Inter
    code: Roboto Mono
  features:
    - announce.dismiss
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github
  language: en
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
