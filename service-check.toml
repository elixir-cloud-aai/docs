# Configuration of the weekly service check (`scripts/check_services.py`,
# job `services` of `.github/workflows/links.yml`). The check collects the
# GA4GH service URLs (`.../ga4gh/<api>/v<n>`) named in the docs and reports
# those that are not in the Cloud Registry or don't answer
# `GET <url>/service-info`. Placeholders and local hosts (`example.org`,
# `<HOST>`, `localhost`, `.local`, `.internal`, in-cluster names, loopback
# and private addresses) are always skipped

# Public third-party services, which are not ours to register. They are
# skipped entirely (subdomains included)
skip_hosts = [
  "dockstore.org",
  "workflowhub.eu",
]

# Our services that the docs still name but that are not in the registry
# yet, each with the reason. They must still answer `service-info`. The
# check reports an entry once its service is registered or no page names it
# any more, so that this list only shrinks
[unregistered]
"https://tesk.rahtiapp.fi/ga4gh/tes/v1" = "TESK for tests at CSC, default of the TES tutorial; not registered (generic-issues#35)"
"https://gateway-tes.elixir-on.cloud/ga4gh/tes/v1" = "registered under its old address protes.rahtiapp.fi until generic-issues#127"
"https://poiesis.dyn.cloud.e-infra.cz/ga4gh/tes/v1" = "Poiesis of the CZ Node at CERIT-SC; registration pending (generic-issues#52)"
"https://poiesis.rahtiapp.fi/ga4gh/tes/v1" = "Poiesis of the FI Node on Rahti; upgraded 2026-11-26, not registered yet"
